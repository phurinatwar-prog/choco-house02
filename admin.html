<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHOCO HOUSE | Order Admin</title><link rel="stylesheet" href="style.css"><style>
.admin-wrap{max-width:1100px;margin:45px auto;padding:0 20px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.admin-head h1{font:600 32px var(--serif)}.admin-tools{display:flex;gap:8px;flex-wrap:wrap}.admin-tools input{padding:10px;border:1px solid var(--line)}.admin-btn{padding:10px 14px;border:1px solid var(--brown);background:var(--brown);color:white;cursor:pointer;font:13px var(--sans)}.admin-btn.light{background:transparent;color:var(--brown)}.admin-table{width:100%;border-collapse:collapse;margin-top:25px;font-size:13px}.admin-table th,.admin-table td{padding:12px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.admin-table th{background:var(--cream)}.status{padding:5px 8px;background:#f1e6d9;white-space:nowrap}.admin-login{max-width:420px;background:var(--cream);padding:25px;margin:30px 0}.admin-login label{display:block;font-size:13px;margin:12px 0}.admin-login input{display:block;width:100%;padding:12px;border:1px solid var(--line);margin-top:6px}.admin-message{color:#8b4e32;font-size:13px}.admin-actions{display:flex;gap:5px;flex-wrap:wrap}.admin-actions button{font:11px var(--sans);padding:6px;border:1px solid var(--line);background:white;cursor:pointer}.print-area{display:none}@media print{body *{visibility:hidden}.print-area,.print-area *{visibility:visible}.print-area{display:block;position:absolute;left:0;top:0;width:100%;padding:20px;color:#000;font-family:Arial}.print-area h2{font-size:22px}.print-area table{width:100%;border-collapse:collapse}.print-area td,.print-area th{border:1px solid #777;padding:8px;text-align:left}.no-print{display:none!important}}
</style></head><body><div class="announcement">CHOCO HOUSE · ORDER MANAGEMENT</div><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">C</span><span>CHOCO <b>HOUSE</b><small>ORDER MANAGEMENT</small></span></a><a href="index.html">กลับหน้าร้าน ↗</a></header>
